app:
  baseUrl: https://backstage.devopstia.com

backend:
  baseUrl: https://backstage.devopstia.com
  listen: ':7007'
  cors:
    origin: https://backstage.devopstia.com
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_CLIENT_ID}
          clientSecret: ${GITHUB_CLIENT_SECRET}
          webhookSecret: ${GITHUB_WEBHOOK_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}

catalog:
  providers:
    # GitHub App discovery — varre todos os repos da org automaticamente
    # Sem PAT: usa o token de instalação do GitHub App
    githubOrg:
      id: production
      githubUrl: https://github.com
      orgs:
        - hugosleao
    github:
      production:
        organization: hugosleao
        catalogPath: /catalog-info.yaml
        filters:
          branch: master
          repository: ".*"
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    - type: url
      target: https://github.com/${GITHUB_ORG}/platform-templates/blob/master/all-templates.yaml
      rules:
        - allow: [Template]
